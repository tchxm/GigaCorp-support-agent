services:
  - type: web
    name: gigacorp-support-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROUNDING_THRESHOLD
        value: "0.35"
      - key: GROQ_API_KEY
        sync: false
